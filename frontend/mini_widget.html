<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Usage Monitor Widget</title>
  <link rel="icon" type="image/jpeg" href="/assets/icons/app_icon_johnny5.jpg">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: rgba(8, 11, 17, 0.98);
      margin: 0;
      padding: 8px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      height: 100vh;
      box-sizing: border-box;
    }
    .widget-container {
      background: rgba(15, 22, 36, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), 0 0 15px rgba(6, 182, 212, 0.12);
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      box-sizing: border-box;
      -webkit-app-region: drag;
      cursor: grab;
    }
    .widget-container:active {
      cursor: grabbing;
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: drag;
    }
    .widget-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      font-weight: 700;
      color: #fff;
      -webkit-app-region: no-drag;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }
    .widget-title:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .widget-actions {
      display: flex;
      gap: 5px;
      -webkit-app-region: no-drag;
    }
    .widget-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-app-region: no-drag;
    }
    .widget-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .widget-btn-close:hover {
      color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
    }
    .widget-tokens {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      -webkit-app-region: no-drag;
    }
    .widget-tokens .num {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: -0.02em;
    }
    .widget-tokens .lbl {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .widget-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 8px;
      -webkit-app-region: no-drag;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <div style="display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag;">
        <img src="/assets/icons/app_icon_johnny5.jpg" alt="Johnny 5" style="width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(6, 182, 212, 0.4); box-shadow: 0 0 8px rgba(6, 182, 212, 0.3); object-fit: cover; flex-shrink: 0;" title="AI Usage Monitor • Johnny 5">
        <div class="widget-title" onclick="window.Widget.cycleProvider()" title="Click to cycle active provider (Claude, Gemini, ChatGPT, Ollama, Copilot)">
          <span class="dot dot-green" id="w-status-dot"></span>
          <span id="w-provider-name">Claude</span>
          <span class="badge badge-claude" id="w-plan-badge" style="font-size: 0.65rem; padding: 2px 6px;">Pro</span>
          <span style="font-size: 0.65rem; opacity: 0.5;">▼</span>
        </div>
      </div>
      <div class="widget-actions">
        <button class="widget-btn" onclick="window.Widget.sync()" title="Sync Token Quota">🔄</button>
        <button class="widget-btn" onclick="window.open('/', '_blank')" title="Open Full Dashboard">↗</button>
        <button class="widget-btn widget-btn-close" onclick="window.close()" title="Close Widget Window">✕</button>
      </div>
    </div>

    <div class="widget-tokens">
      <div>
        <div class="num" id="w-tokens-today">0</div>
        <div class="lbl" id="w-tokens-lbl">CLAUDE TOKENS TODAY</div>
      </div>
      <div style="text-align: right;">
        <div style="font-family: var(--font-mono); font-size: 0.95rem; color: #cbd5e1;" id="w-tokens-remaining">--</div>
        <div class="lbl">QUOTA REMAINING</div>
      </div>
    </div>

    <!-- Mini Progress Bar -->
    <div class="progress-bar-container" style="height: 5px; margin: 0; background: rgba(255,255,255,0.06);">
      <div class="progress-bar-fill" id="w-progress-fill" style="width: 85%;"></div>
    </div>

    <!-- Bottom Stats -->
    <div class="widget-stats-row">
      <div class="stat-item">
        <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;">RESET IN</span>
        <span class="stat-val" id="w-reset-time">--</span>
      </div>
      <div class="stat-item" style="text-align: center;">
        <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;">SESSIONS</span>
        <span class="stat-val" id="w-session-count">0</span>
      </div>
      <div class="stat-item" style="text-align: right;">
        <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600;">EST. COST</span>
        <span class="stat-val" id="w-cost-val">$0.000</span>
      </div>
    </div>
  </div>

  <script src="/js/widget.js"></script>
</body>
</html>
