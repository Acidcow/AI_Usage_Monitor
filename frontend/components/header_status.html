<div class="status-pill-row" id="provider-pills-row">
  <div class="provider-pill" id="pill-claude">
    <span class="dot dot-green" id="dot-claude"></span>
    <strong>Claude</strong>
    <span class="badge badge-claude" id="badge-claude-plan">Team Pro</span>
    <span style="font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted);" id="claude-pill-tokens">-- tokens</span>
  </div>
  
  <div class="provider-pill" id="pill-copilot">
    <span class="dot dot-amber" id="dot-copilot"></span>
    <strong>M365 Copilot</strong>
    <span class="badge badge-copilot">Enterprise Restr.</span>
  </div>

  <div class="provider-pill" id="pill-gemini">
    <span class="dot dot-gray" id="dot-gemini"></span>
    <strong>Gemini</strong>
    <span style="font-size: 0.75rem; color: var(--text-dim);" id="gemini-status-text">Standby</span>
  </div>

  <div class="provider-pill" id="pill-ollama">
    <span class="dot dot-gray" id="dot-ollama"></span>
    <strong>Ollama</strong>
    <span style="font-size: 0.75rem; color: var(--text-dim);" id="ollama-status-text">Local</span>
  </div>

  <div class="provider-pill" id="pill-data-mode" style="margin-left: auto; border: 1px solid rgba(6, 182, 212, 0.4); background: rgba(6, 182, 212, 0.08);">
    <span class="dot dot-green" id="dot-data-mode"></span>
    <span style="font-weight: 700; color: var(--accent-cyan); font-size: 0.78rem;" id="text-data-mode">LIVE LOCAL DATA</span>
    <button onclick="window.App.toggleDataMode()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; margin-left: 6px;">
      Toggle Mode
    </button>
  </div>
</div>
